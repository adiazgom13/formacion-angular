@if (isLoading()) {
  <div class="loading-overlay" role="alert" aria-busy="true" aria-live="polite">
    <div class="loading-overlay__backdrop"></div>
    <div class="loading-overlay__content">
      <div class="loading-overlay__spinner" aria-hidden="true"></div>
      <div class="loading-overlay__text">Cargando…</div>
    </div>
  </div>
}
